[package]
name = "kcx"
version = "1.0.0"
edition = "2021"

[dependencies]
# Serialization (The Protocol)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# The State Engine
kdl = "4.6"
regex = "1.10"
lazy_static = "1.4"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
inquire = "0.9.1"
miette = "7.6.0"
similar = "2.7.0"
console = "0.16.1"

[dev-dependencies]
tempfile = "3.8"
